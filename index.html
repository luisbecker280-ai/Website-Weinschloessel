<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2e2e2e" />
  <meta name="description"
        content="Ristorante Weinschlössel – Winelounge & Pizzeria in Bad Bergzabern. Italienische Küche, Pizza, Events, Partyservice und Prodotto di Piero." />
  <title>Ristorante Weinschlössel – Winelounge</title>

  <!-- Favicon: eingebettetes gold-Oval mit "W" (kein externer Download) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='32' rx='30' ry='24' fill='%23a8893f'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-style='italic' font-size='34' fill='white' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E" />

  <!-- Wichtigste Schriften vorab laden (schnellerer, ruhigerer Aufbau) -->
  <link rel="preload" href="assets/fonts/montserrat-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/cormorant-garamond-600.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Stylesheets in fester Reihenfolge: Schriften -> Variablen -> Basis -> Layout -> Komponenten -> Seiten -->
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <!-- Obere Navigationsleiste (wird von Navbar.js gefüllt) -->
  <header class="site-header" id="site-header"></header>

  <!-- Hier wird die jeweils aktive Seite eingesetzt (durch Router.js) -->
  <main id="app" class="app"></main>

  <!-- Fußbereich (wird von Footer.js gefüllt) -->
  <footer class="site-footer" id="site-footer"></footer>

  <!-- Einstiegspunkt der Anwendung. type="module" erlaubt import/export. -->
  <script type="module" src="js/app.js"></script>

  <!-- Hinweis, falls JavaScript deaktiviert ist -->
  <noscript>
    <p style="padding:1rem;text-align:center;">
      Bitte aktivieren Sie JavaScript, um diese Website vollständig nutzen zu können.
    </p>
  </noscript>
</body>
</html>
