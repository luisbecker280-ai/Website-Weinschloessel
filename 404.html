<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Seite nicht gefunden – Ristorante Weinschlössel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='32' rx='30' ry='24' fill='%23a8893f'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-style='italic' font-size='34' fill='white' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    .nf { text-align:center; padding:2rem; max-width:32rem; }
    .nf__logo { width:120px; height:auto; margin-bottom:1.5rem; }
    .nf__code { font-family:var(--font-serif); font-size:clamp(3rem,10vw,5rem);
                color:var(--color-gold); margin:0; line-height:1; }
    .nf__title { font-family:var(--font-serif); letter-spacing:.14em; text-transform:uppercase;
                 font-size:1.3rem; margin:.8rem 0 1rem; }
    .nf__text { color:var(--color-text-soft); margin-bottom:1.8rem; }
    .nf__link { display:inline-block; padding:.8rem 1.6rem; border-radius:999px;
                background:var(--color-olive); color:#fff; text-decoration:none;
                letter-spacing:.06em; transition:background .25s ease; }
    .nf__link:hover { background:var(--color-olive-dark); }
  </style>
</head>
<body>
  <main class="nf">
    <img class="nf__logo" src="/assets/img/logo.jpg" alt="Ristorante Weinschlössel" />
    <p class="nf__code">404</p>
    <h1 class="nf__title">Seite nicht gefunden</h1>
    <p class="nf__text">
      Diese Seite gibt es leider nicht (mehr). Vielleicht hat sich ein Tippfehler
      in die Adresse eingeschlichen.
    </p>
    <a class="nf__link" href="/">Zur Startseite</a>
  </main>
</body>
</html>
